<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PyArx 纯 Python 窗体</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--line:#e4eaf2;--ink:#1f2937;--sub:#6b7280;--brand:#2f6fba}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.7 "Microsoft YaHei","Segoe UI",sans-serif}
  .wrap{display:flex;flex-direction:column;height:100%}
  header{padding:16px 20px 12px;background:#fff;border-bottom:1px solid var(--line)}
  header b{display:block;font-size:18px;color:#123c66}
  header span{font-size:12px;color:var(--sub)}
  .body{flex:1;padding:16px 20px;overflow:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:800px}
  .card h3{margin:0 0 12px;font-size:15px;color:#123c66}
  button{appearance:none;border:1px solid #cfd9e6;background:#fff;color:var(--ink);border-radius:8px;
         padding:10px 14px;font:inherit;cursor:pointer;margin:0 8px 8px 0}
  button.pri{background:var(--brand);border-color:var(--brand);color:#fff}
  #out{margin-top:6px;min-height:96px;background:#f7f9fc;border:1px dashed #cfd9e6;border-radius:8px;
       padding:10px;font-size:13px;color:#123c66;white-space:pre-wrap}
  footer{padding:8px 20px;border-top:1px solid var(--line);background:#fff;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <b>PyArx 纯 Python 窗体</b>
    <span>MFC 只做外壳，控件全部是这个 HTML；按钮由 Python 的 setCommandHandler 接住</span>
  </header>
  <div class="body">
    <div class="card">
      <h3>点按钮 → Python 执行</h3>
      <button class="pri" id="btnHello">① 让 Python print 一条消息</button>
      <button id="btnAdd">② 让 Python 算 137 + 265</button>
      <button id="btnEnv">③ 问 Python 环境信息</button>
      <div id="out">点一下上面的按钮</div>
    </div>
  </div>
  <footer id="foot">等待 Python 就绪…</footer>
</div>
<script>
  const wv = window.chrome && window.chrome.webview;
  const out = document.getElementById('out');
  const foot = document.getElementById('foot');
  foot.textContent = wv ? '已接 chrome.webview' : '无 chrome.webview（不是 WebView2）';

  function post(payload, label) {
    out.textContent = label + ' …（等 Python 回执）';
    if (wv) wv.postMessage(payload);
  }

  document.getElementById('btnHello').onclick = () => post(
    { cmd: 'py.hello', args: { seq: 1, text: '页面传来的中文' } }, '让 Python print');
  document.getElementById('btnAdd').onclick = () => post(
    { cmd: 'py.add', args: { a: 137, b: 265 } }, '让 Python 算加法');
  document.getElementById('btnEnv').onclick = () => post({ cmd: 'py.env' }, '问环境');

  if (wv) {
    wv.addEventListener('message', (e) => {
      const d = e.data;
      if (d && d.event === 'py.result') out.textContent = (d.ok ? '✔ ' : '✘ ') + d.text;
      else if (d && d.event === 'shell.ready') foot.textContent = 'WebView 就绪：' + d.width + ' × ' + d.height;
    });
  }
</script>
</body>
</html>
