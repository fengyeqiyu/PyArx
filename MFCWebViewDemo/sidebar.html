<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>侧栏</title>
<style>
  :root{
    --panel:#ffffff; --ink:#1f2a37; --ink2:#5b6675; --line:#e2e7ee;
    --accent:#2f6fba; --accent-weak:#eaf2fb;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex; flex-direction:column; background:var(--panel); color:var(--ink);
    font:13px/1.5 "Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;
    overflow:hidden; border-right:1px solid var(--line);
  }

  .brand{padding:16px 16px 12px; border-bottom:1px solid var(--line)}
  .brand h1{margin:0; font-size:15px; letter-spacing:.3px}
  .brand p{margin:4px 0 0; font-size:12px; color:var(--ink2)}
  .tagline{
    display:inline-block; margin-top:8px; padding:2px 8px; border-radius:999px;
    background:var(--accent-weak); color:var(--accent); font-size:11px;
  }

  nav{padding:8px 8px; flex:1; overflow:auto}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 12px; margin:2px 0;
    border-radius:8px; color:var(--ink2); cursor:pointer; user-select:none;
  }
  .nav-item:hover{background:#f6f8fb; color:var(--ink)}
  .nav-item.active{background:var(--accent-weak); color:var(--accent); font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.55}

  .foot{padding:10px 12px; border-top:1px solid var(--line); display:flex; align-items:center; gap:8px}
  .foot .ver{font-size:11px; color:#93a0b1; flex:1}
  button{
    font:inherit; font-size:12px; height:28px; padding:0 10px; border-radius:7px;
    border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer;
  }
  button:hover{border-color:#c8d3e2; background:#f8fafd}

  /* 右缘拖宽手柄：6px 热区，视觉只是一条线 */
  .grip{
    position:fixed; top:0; right:0; width:6px; height:100%;
    cursor:col-resize; background:transparent;
  }
  .grip:hover{background:var(--accent-weak)}
</style>
</head>
<body>
  <div class="brand">
    <h1>MFCWebView</h1>
    <p>窗体外壳 = MFC · 控件 = Web</p>
    <div class="tagline">侧栏＝独立 WebView 实例</div>
  </div>

  <nav id="nav">
    <div class="nav-item active" data-page="dash"><span class="dot"></span>工作台</div>
    <div class="nav-item" data-page="plan"><span class="dot"></span>配电干线图</div>
    <div class="nav-item" data-page="devices"><span class="dot"></span>设备台账</div>
    <div class="nav-item" data-page="report"><span class="dot"></span>报表中心</div>
    <div class="nav-item" data-page="settings"><span class="dot"></span>设置</div>
  </nav>

  <div class="foot">
    <span class="ver" id="ver">v0.1</span>
    <button id="btnCollapse">收起侧栏</button>
  </div>

  <div class="grip" id="grip" title="拖动可改侧栏宽度"></div>

<script>
(function () {
  const wv = (window.chrome && window.chrome.webview) ? window.chrome.webview : null;
  const $ = (id) => document.getElementById(id);
  function send(o) { if (wv) wv.postMessage(o); }

  if (wv) {
    wv.addEventListener('message', (e) => {
      const d = e.data || {};
      if (d.event === 'shell.ready' || d.event === 'shell.info') {
        $('ver').textContent = 'v0.1 · 侧栏 ' + (d.width || '?') + ' px';
      } else if (d.event === 'pane.state') {
        $('btnCollapse').textContent = d.collapsed ? '已收起' : '收起侧栏';
        $('ver').textContent = 'v0.1 · 侧栏 ' + (d.width || '?') + ' px';
      }
    });
  }

  /* 导航：只发命令，主区由 MFC 转发更新 */
  document.querySelectorAll('.nav-item').forEach((el) => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach((x) => x.classList.remove('active'));
      el.classList.add('active');
      send({ cmd: 'nav', page: el.dataset.page });
    });
  });

  $('btnCollapse').addEventListener('click', () => send({ cmd: 'pane.toggle' }));

  /* 右缘按下 → 交给 MFC 走捕获拖动 */
  $('grip').addEventListener('mousedown', (e) => {
    e.preventDefault();
    send({ cmd: 'pane.dragbegin' });
  });

  setTimeout(() => send({ cmd: 'shell.info' }), 60);
})();
</script>
</body>
</html>
